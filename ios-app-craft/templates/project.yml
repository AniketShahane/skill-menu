# XcodeGen spec for a SwiftUI iPhone app: the app, unit tests, UI tests, a logic package, and a
# Release "Motion" scheme for measuring animation without a debugger.
#
# Wire in: replace MyApp / com.example.myapp everywhere, folder names included:
#   sed -i '' 's/com\.example\.myapp/com.you.name/g; s/MyApp/Name/g' project.yml scripts/run-ui-tests.sh
# then `brew install xcodegen && xcodegen generate`. Commit project.yml, gitignore the
# generated MyApp.xcodeproj, build/ and Secrets.xcconfig. Copy Secrets.example.xcconfig to
# Secrets.xcconfig for local keys. Create the logic package once:
#   mkdir MyAppCore && (cd MyAppCore && swift package init --type library --name MyAppCore)
#
# Lessons it encodes:
# - The project file is generated. Nobody merges a .pbxproj, and adding a file is creating it.
# - Logic lives in a local Swift package (MyAppCore): `swift test` runs it in seconds with no
#   simulator, and a port from another platform can be checked test for test against the
#   original's suite.
# - ProMotion needs CADisableMinimumFrameDurationOnPhone. Without it every animation in an
#   iPhone app is held to 60 Hz, however smooth the code is.
# - Secrets come from a gitignored xcconfig through `#include?`: a clean checkout still builds,
#   and the app falls back when the key is empty.
# - Measure motion on a Release build with no debugger attached (the Motion scheme): a Debug
#   build's frames are not the ones people see.

name: MyApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    # The kit's templates also compile clean in Swift 6 mode; move up when your code is ready.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  MyAppCore:
    path: MyAppCore
targets:
  MyApp:
    type: application
    platform: iOS
    sources:
      - path: MyApp
    dependencies:
      - package: MyAppCore
    info:
      path: MyApp/Info.plist
      properties:
        CFBundleDisplayName: MyApp
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          # A colour set in the asset catalog matching the first screen's background: no flash.
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        # ProMotion: without this an iPhone app's animations are held to 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # From Secrets.xcconfig (gitignored). Read with Bundle.main.object(forInfoDictionaryKey:).
        API_KEY: $(API_KEY)
        # Bundled fonts, by file name:
        # UIAppFonts: [Inter-Regular.ttf, Inter-SemiBold.ttf]
        # Every permission needs its sentence, saying what the user gets:
        # NSLocationWhenInUseUsageDescription: MyApp uses your location to ...
        # UIBackgroundModes: [location, audio]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only; "1,2" adds iPad.
        TARGETED_DEVICE_FAMILY: "1"
  MyAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MyAppTests]
    dependencies:
      - target: MyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.tests
  MyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MyAppUITests]
    dependencies:
      - target: MyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.myapp.uitests
        TEST_TARGET_NAME: MyApp
schemes:
  MyApp:
    build:
      targets:
        MyApp: all
        MyAppTests: [test]
        MyAppUITests: [test]
    test:
      targets:
        - MyAppTests
        - MyAppUITests
      gatherCoverageData: false
  # The motion guardrail: the UI journey alone, on a Release build, no debugger, no coverage,
  # as Apple recommends for performance tests.
  MyAppMotion:
    build:
      targets:
        MyApp: all
        MyAppUITests: [test]
    test:
      config: Release
      debugEnabled: false
      targets:
        - MyAppUITests
      gatherCoverageData: false
