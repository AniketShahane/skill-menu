# Project-wide Gradle settings.

# R8 full mode on the release build is the heaviest task here (Dash's value; Flick ran two
# apps on 2 GB).
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Independent module tasks in parallel, and build outputs reused across builds (Flick's set).
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

android.useAndroidX=true
# One R class per module instead of a fat transitive one: faster, smaller.
android.nonTransitiveRClass=true
kotlin.code.style=official

# A connected test run uninstalls the APKs it installed when it finishes. The baseline-profile
# generator installs THIS app, so on the personal phone that run would delete the user's data.
# AGP 9.3.0 defines this option (BooleanOption); its effect on a generator run is not yet
# verified on a device, so back the phone up first anyway (scripts/install-phone.sh --backup).
android.injected.androidTest.leaveApksInstalledAfterRun=true

# --- Starter switches (pass -P<name>=true to turn one on) ---

# Run the instrumentation suites against the minified release build instead of debug
# (dash:app/build.gradle.kts:56-61). Adds proguard-test-app-rules.pro to the app.
appTestRelease=false

# Ship Compose composition tracing + the Perfetto binary in the build, so scripts/trace-phone.sh
# shows composable names in a non-debuggable trace. Fine for personal and dogfood builds; keep it
# off for Play (dash:app/build.gradle.kts:85-89).
appTracing=false
